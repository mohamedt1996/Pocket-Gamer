name: Probe official Proton EAC runtime

on:
  push:
    tags: ['eac-probe-*']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install SteamCMD from Valve
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-i386 lib32gcc-s1 lib32stdc++6
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fLsS --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
      - name: Try anonymous install of Steam tool 1826330
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/steamcmd"
          set +e
          timeout 600 ./steamcmd.sh +force_install_dir "$RUNNER_TEMP/proton-eac" \
            +login anonymous +app_update 1826330 validate +quit > "$RUNNER_TEMP/steamcmd.log" 2>&1
          result=$?
          set -e
          tail -40 "$RUNNER_TEMP/steamcmd.log"
          echo "SteamCMD exit code: $result"
          {
            echo '### Anonymous SteamCMD result'
            echo "Exit code: $result"
            echo '```text'
            tail -25 "$RUNNER_TEMP/steamcmd.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" -ne 0 ]]; then
            diagnostic=$(grep -iE 'error|failed|subscription|login' "$RUNNER_TEMP/steamcmd.log" | tail -5 | tr '\n' ' ' | cut -c1-500 || true)
            echo "::error title=SteamCMD anonymous install failed::$diagnostic"
            exit "$result"
          fi
          find "$RUNNER_TEMP/proton-eac" -maxdepth 4 -type f \
            \( -iname 'license*' -o -iname 'copying*' -o -iname '*eula*' -o -name 'easyanticheat*.so' \) \
            -printf '%P (%s bytes)\n' | sort
          find "$RUNNER_TEMP/proton-eac" -type f -name 'easyanticheat*.so' -exec file {} \;
          echo 'Installed bytes:'
          du -sh "$RUNNER_TEMP/proton-eac"
