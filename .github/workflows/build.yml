    - name: Restore fex
      uses: actions/cache/restore@v5
      id: cache_fex
      with:
        path: FEX/build-ios
        key: ${{ steps.cachekeys.outputs.fex }}
    - name: Build FEX native iOS CPU translator libraries
      run: |
        # cache-source: fex
        cmake -S FEX -B FEX/build-ios -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_MACOSX_BUNDLE=OFF \
          -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
          -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_FEX_ALLOCATOR=OFF \
          -DENABLE_ASSERTIONS=OFF -DENABLE_CLANG_THUNKS=ON \
          -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \
          -DTUNE_CPU=generic -DTUNE_ARCH=generic -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON \
          2>&1 | tee fex-configure.log
        cmake --build FEX/build-ios -j2 --target FEXCore FEXCore_Base JemallocLibs cephes_128bit softfloat_3e fmt xxhash 2>&1 | tee fex-build.log
      if: steps.cache_fex.outputs.cache-hit != 'true'
    - name: Save completed fex
      uses: actions/cache/save@v5
      if: steps.cache_fex.outputs.cache-hit != 'true'
      with:
        path: FEX/build-ios
        key: ${{ steps.cachekeys.outputs.fex }}
    - name: Restore dxmt
      uses: actions/cache/restore@v5
      id: cache_dxmt
      with:
        path: app/Madeira/libdxmt_combined.a
        key: ${{ steps.cachekeys.outputs.dxmt }}
    - name: Build Direct3D-to-Metal adapter and shader translator
      run: |
        # cache-source: dxmt
        xcodebuild -downloadComponent MetalToolchain
        # Match dxmt/src/airconv/meson.build and its Metal -> AIR -> C-header generators.
        # These are embedded AIR helper modules, not a macOS app binary.
        # Avoid a private Metal intrinsic whose signature changed in Xcode 27.
        python3 - <<'PYMETAL'
        from pathlib import Path
        p = Path('dxmt/src/airconv/shaders/air_tessellation.metal')
        old = '__metal_atomic_fetch_add_explicit(out_count, 1, int(memory_order_relaxed), __METAL_MEMORY_SCOPE_THREADGROUP__)'
        new = 'atomic_fetch_add_explicit(reinterpret_cast<threadgroup atomic_int *>(out_count), 1, memory_order_relaxed)'
        source = p.read_text()
        if source.count(old) != 1:
            raise SystemExit('Unexpected DXMT atomic source; review compatibility patch')
        p.write_text(source.replace(old, new))
        PYMETAL
        mkdir -p build/dxmt-ios/shader-headers
        for shader in air_msad air_samplepos air_tessellation; do
          xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 \
            -c "dxmt/src/airconv/shaders/$shader.metal" \
            -o "build/dxmt-ios/shader-headers/$shader.air"
          xxd -n "$shader" -i "build/dxmt-ios/shader-headers/$shader.air" \
            "build/dxmt-ios/shader-headers/$shader.h"
          test -s "build/dxmt-ios/shader-headers/$shader.h"
        done
        if bash build/dxmt-ios/build.sh 2>&1 | tee dxmt.log; then
          :
        else
          # Upstream redirects compiler diagnostics into individual .err files.
          python3 - <<'PYERRORS'
        from pathlib import Path
        for p in sorted(Path('build/dxmt-ios/obj').glob('*.err')):
            text=p.read_text(errors='replace')
            if 'error:' in text:
                print('=== '+str(p)+' ===', flush=True)
                print(text, flush=True)
        PYERRORS
          exit 1
        fi
        xcrun -sdk iphoneos libtool -static -o app/Madeira/libdxmt_combined.a \
          build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
      if: steps.cache_dxmt.outputs.cache-hit != 'true'
    - name: Save completed dxmt
      uses: actions/cache/save@v5
      if: steps.cache_dxmt.outputs.cache-hit != 'true'
      with:
        path: app/Madeira/libdxmt_combined.a
        key: ${{ steps.cachekeys.outputs.dxmt }}
    - name: Restore pairing
      uses: actions/cache/restore@v5
      id: cache_pairing
      with:
        path: |-
          app/Madeira/libmadeira_rppairing.a
          app/Madeira/legal/LICENSES-rppairing-crates.txt
        key: ${{ steps.cachekeys.outputs.pairing }}
    - name: Build pairing library
      run: |
        # cache-source: pairing
        bash build/rppairing-ios/build.sh 2>&1 | tee pairing.log
      if: steps.cache_pairing.outputs.cache-hit != 'true'
    - name: Save completed pairing
      uses: actions/cache/save@v5
      if: steps.cache_pairing.outputs.cache-hit != 'true'
      with:
        path: |-
          app/Madeira/libmadeira_rppairing.a
          app/Madeira/legal/LICENSES-rppairing-crates.txt
        key: ${{ steps.cachekeys.outputs.pairing }}
    - name: Restore dock
      uses: actions/cache/restore@v5
      id: cache_dock
      with:
        path: |-
          app/Madeira/arm64ec-windows/dockhost.exe
          app/Madeira/arm64ec-windows/dock-notices.txt
        key: ${{ steps.cachekeys.outputs.dock }}
    - name: Build Steam dock helper
      run: |
        # cache-source: dock
        # Run native tests with Apple's host compiler, independent of MinGW in PATH.
        host_cc="$(xcrun --sdk macosx --find clang)"
        host_sdk="$(xcrun --sdk macosx --show-sdk-path)"
        test -x "$host_cc"
        test -f "$host_sdk/usr/include/assert.h"
        (cd madeira-dock && HOST_CC="$host_cc" SDKROOT="$host_sdk" bash tools/check.sh) 2>&1 | tee dock-tests.log
        # Build the Windows helper separately with its explicit MinGW compiler.
        bash build/madeira-dock/build.sh 2>&1 | tee dock.log
      if: steps.cache_dock.outputs.cache-hit != 'true'
    - name: Save completed dock
      uses: actions/cache/save@v5
      if: steps.cache_dock.outputs.cache-hit != 'true'
      with:
        path: |-
          app/Madeira/arm64ec-windows/dockhost.exe
          app/Madeira/arm64ec-windows/dock-notices.txt
        key: ${{ steps.cachekeys.outputs.dock }}
    - name: Verify required runtime archives and PE modules
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        root=Path('app/Madeira')
        s=Path('app/Madeira.xcodeproj/project.pbxproj').read_text()
        paths=re.findall(r'isa = PBXFileReference; lastKnownFileType = archive.ar;.*?path = "?([^;"\n]+)"?;',s)
        missing=[str(root/p) for p in paths if not (root/p).is_file()]
        for n in ['ntdll.dll','kernel32.dll','kernelbase.dll','d3d11.dll','dxgi.dll','winemetal.dll','xtajit64.dll','dockhost.exe']:
            if not (root/'arm64ec-windows'/n).is_file(): missing.append(n)
        if missing: raise SystemExit('Missing runtime inputs: '+', '.join(missing))
        print('Verified',len(paths),'native archives and required PE modules')
        PY
    - uses: actions/checkout@v7
      with:
        repository: libretro/SameBoy
        ref: aa158a889a48b538a0302873704a34577c8eb67d
        path: pocket-sameboy
        persist-credentials: false
    - uses: actions/cache/restore@v5
      id: pocketcore
      with:
        path: pocket-core-cache/libpocket_sameboy.a
        key: pocket-sameboy-v1-aa158a88-${{ steps.sdk.outputs.id }}-${{ hashFiles('pocket-additions/build_gb.sh')
          }}
    - name: Integrate hub and build embedded GB/GBC engine
      run: |
        python3 pocket-additions/integrate.py
        xcrun swiftc -frontend -parse app/Madeira/Library.swift
        bash pocket-additions/build_gb.sh
    - uses: actions/cache/save@v5
      if: steps.pocketcore.outputs.cache-hit != 'true'
      with:
        path: pocket-core-cache/libpocket_sameboy.a
        key: ${{ steps.pocketcore.outputs.cache-primary-key }}
    - name: Generate and cross-compile a real x64 Windows smoke test
      run: |
        cat > output/pocket-smoke.c <<'C'
        #include <windows.h>
        int WINAPI WinMain(HINSTANCE a,HINSTANCE b,LPSTR c,int d) {
            (void)a; (void)b; (void)c; (void)d;
            HANDLE f=CreateFileA("pocket-smoke-result.txt",GENERIC_WRITE,0,0,CREATE_ALWAYS,FILE_ATTRIBUTE_NORMAL,0);
            if(f==INVALID_HANDLE_VALUE) {
                MessageBoxA(0,"Windows code ran, but the current directory is not writable.","Pocket runtime test",MB_OK|MB_ICONWARNING);
                return 2;
            }
            const char text[]="x64 instructions and Win32 file I/O executed. This does not test Direct3D or Steam.\r\n";
            DWORD n=0; BOOL ok=WriteFile(f,text,sizeof(text)-1,&n,0); CloseHandle(f);
            MessageBoxA(0,ok?"x64 execution and file write passed. Next: test a small Direct3D game.":"x64 execution passed; file write failed.","Pocket runtime test",MB_OK);
            return ok?0:3;
        }
        C
        x86_64-w64-mingw32-clang -O2 -mwindows output/pocket-smoke.c -o output/pocket-smoke.exe -luser32
        file output/pocket-smoke.exe
    - name: Prepare resources, notices and build identity
      run: |
        # No Microsoft runtime DLLs are silently supplied or substituted.
        mkdir -p app/Madeira/x86_64-vcruntime
        bash build/stage-licenses.sh
        python3 - <<'PY'
        import plistlib,os
        from pathlib import Path
        p=Path('app/Madeira/Info.plist');d=plistlib.loads(p.read_bytes())
        d['CFBundleDisplayName']='Pocket Arcade'
        d['CFBundleVersion']=os.environ['GITHUB_RUN_NUMBER']
        p.write_bytes(plistlib.dumps(d))
        PY
        cat > output/READ-ME.txt <<'TXT'
        EXPERIMENTAL BUILD: Pocket Arcade, based on willfaust/Madeira.
        Experimental Windows + GB/GBC hub. Not Proton and not an App Store build.
        Pinned upstream: 279fd0f83170425db002fe25d6bd62f6355f497d.
        Native iOS libraries are compiled here; existing upstream PE DLLs and StikJIT framework are reused.
        No claim of game compatibility or on-device validation is made by a successful build.
        Sideload with a compatible signer; enable JIT and check Madeira's Memory+ readiness.
        Unsigned IPA creation does not grant JIT or memory entitlements.
        Import pocket-smoke.exe into the app's game library and launch it first.
        A successful dialog tests x64 code and basic Win32 I/O, NOT Direct3D or Steam.
        Some games need Microsoft's VC++ runtime, installed separately in the guest environment.
        Added hub, GB/GBC core, Epic companion transfers, GB/GBC artwork searches and PS1 BIOS validation.
        Other console engines and Android app are not supplied; no Epic launch-token injection.
        Read POCKET-ADDITIONS.md and the companion setup instructions before use.
        Keep this workflow and upstream sources/notices with any redistributed derivative.
        TXT
        cp pocket-additions/README.md output/POCKET-ADDITIONS.md
        cp -R pocket-additions output/pocket-additions
    - name: Ensure Metal compiler is available for application shaders
      run: |
        # A DXMT cache hit skips its build step, including toolchain installation.
        # The app still compiles its own Metal shaders on this fresh runner.
        if ! xcrun --sdk iphoneos metal --version; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        xcrun --sdk iphoneos metal --version
    - name: Compile the experimental iOS application
      run: |
        xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
          -sdk iphoneos -configuration Debug -destination 'generic/platform=iOS' \
          -derivedDataPath build-out/DerivedData \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
          IPHONEOS_DEPLOYMENT_TARGET=26.0 \
          MADEIRA_BUNDLE_IDENTIFIER=com.pocketarcade.windowslab \
          build 2>&1 | tee archive.log
    - name: Check graphics exports and package unsigned IPA
      run: |
        APP=build-out/DerivedData/Build/Products/Debug-iphoneos/Madeira.app
        test -s "$APP/Madeira"
        # Xcode Debug builds may put the app code in a dylib beside a launcher stub.
        EXPORT_BINARY="$APP/Madeira"
        if [ -f "$APP/Madeira.debug.dylib" ]; then
          test -s "$APP/Madeira.debug.dylib"
          EXPORT_BINARY="$APP/Madeira.debug.dylib"
        fi
        echo "Checking graphics exports in $EXPORT_BINARY"
        xcrun dyld_info -exports "$EXPORT_BINARY" > output/exports.txt
        for sym in macdrv_functions get_win_data release_win_data macdrv_view_create_metal_view macdrv_view_get_metal_layer macdrv_view_release_metal_view; do
          grep -qE "_${sym}$" output/exports.txt || { echo "::error::Missing graphics export $sym"; exit 1; }
        done
        mkdir -p build-out/Payload
        ditto "$APP" build-out/Payload/Madeira.app
        (cd build-out && zip -qry ../output/PocketArcade-unsigned.ipa Payload)
        unzip -tq output/PocketArcade-unsigned.ipa
        cp LICENSE COPYING LICENSE-EXCEPTION.md THIRD-PARTY-NOTICES.md output/
        git diff --binary > output/application-ci.patch
        cp app/Madeira/Madeira.entitlements output/reference-entitlements.plist
        cd output
        shasum -a 256 PocketArcade-unsigned.ipa pocket-smoke.exe > SHA256SUMS.txt
    - uses: actions/upload-artifact@v7
      with:
        name: PocketArcade-iOS-experimental
        path: output/
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: PocketArcade-failure-logs
        path: |-
          *.log
          build/**/*.err
          build/**/err-*.txt
          output/*.txt
        if-no-files-found: warn
        retention-days: 14
    needs: hub_sources
  windows_dependencies:
    name: Prepare official Windows runtime installers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Download Adobe AIR and Wine Mono from vendor sources
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p runtime-packages
        # Adobe AIR is downloaded, not installed into the iOS Windows prefix.
        # A Windows guest-side installation service is still required.
        curl --fail --location --retry 3 --max-time 240 \
          'https://airsdk.wxlift.com/assets/downloads/51.4.1.2/AdobeAIR.exe' \
          -o runtime-packages/AdobeAIR-51.4.1.2.exe
        curl --fail --location --retry 3 --max-time 240 \
          'https://dl.winehq.org/wine/wine-mono/11.0.0/wine-mono-11.0.0-x86.tar.xz' \
          -o runtime-packages/wine-mono-11.0.0-x86.tar.xz
        file runtime-packages/*
        test "$(stat -c%s runtime-packages/AdobeAIR-51.4.1.2.exe)" -gt 100000
        test "$(stat -c%s runtime-packages/wine-mono-11.0.0-x86.tar.xz)" -gt 100000
        sha256sum runtime-packages/* > runtime-packages/SHA256SUMS.txt
        cat > runtime-packages/README.txt <<'EOF'
        These are downloaded vendor packages, NOT installed game dependencies.
        Wine Mono may be installed by Madeira's built-in .NET settings.
        Adobe AIR requires a Windows guest installer implementation and compatibility tests.
        Microsoft Visual C++ redists must be obtained and installed under Microsoft's terms.
        .NET Desktop (Core/5+) is not equivalent to Wine Mono and is not guaranteed to run.
        EOF
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-runtime-installers-uninstalled
        path: runtime-packages/
        if-no-files-found: error

  android_port:
    name: Android Madeira port (requires real native sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Configure Android SDK (without obsolete tools package)
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
        test -x "$SDKMANAGER" || { echo '::error::Android sdkmanager missing on runner'; exit 1; }
        "$SDKMANAGER" --sdk_root="$SDK" --install \
          'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
        yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
    - uses: gradle/actions/setup-gradle@v4
    - name: Verify Android port exists
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f android/gradlew ] || [ ! -f android/app/build.gradle.kts ]; then
          echo '::notice::Android native Madeira/FEX/Wine port has not been implemented in this repository; skipping APK instead of publishing a nonfunctional shell.'
          echo 'ANDROID_PORT_PRESENT=false' >> "$GITHUB_ENV"
        else
          echo 'ANDROID_PORT_PRESENT=true' >> "$GITHUB_ENV"
        fi
    - name: Build Android APK
      if: env.ANDROID_PORT_PRESENT == 'true'
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug
    - name: Publish Android build artifact
      if: env.ANDROID_PORT_PRESENT == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Madeira-Android-debug
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

  publish_ios:
    name: Separate iOS release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_releases == true
    needs: ios_windows_experiment
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: PocketArcade-iOS-experimental
        path: ios-release
    - name: Release unsigned iOS IPA
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        test -s ios-release/PocketArcade-unsigned.ipa
        tag="ios-build-${GITHUB_RUN_NUMBER}"
        gh release create "$tag" ios-release/PocketArcade-unsigned.ipa \
          --title "Pocket Arcade iOS build ${GITHUB_RUN_NUMBER}" \
          --notes 'Experimental unsigned iOS build. JIT and on-device compatibility require validation.' \
          --prerelease

  publish_android:
    name: Separate Android release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_releases == true
    needs: android_port
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Madeira-Android-debug
        path: android-release
    - name: Release Android APK only if a real port compiled
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(android-release/*.apk)
        test "${#apks[@]}" -gt 0 || { echo 'No Android APK built; no Android release'; exit 1; }
        gh release create "android-build-${GITHUB_RUN_NUMBER}" "${apks[@]}" \
          --title "Madeira Android build ${GITHUB_RUN_NUMBER}" \
          --notes 'Experimental Android build. Windows runtime functionality must be tested.' \
          --prerelease
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      publish_releases:
        description: Publish platform-specific releases (only for successful real builds)
        type: boolean
        default: false
      build_full_hub:
        description: Also build the earlier hub template (requires mobile/, server/, ci/ sources)
        type: boolean
        default: false
