    - uses: actions/upload-artifact@v7
      with:
        name: PocketArcade-sources
        path: pocket-additions/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  companion:
    needs: hub_sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: PocketArcade-sources
        path: pocket-additions
    - uses: actions/cache/restore@v5
      id: companioncache
      with:
        path: pocket-image/pocket-companion-image.tar.gz
        key: pocket-companion-amd64-v1-${{ hashFiles('pocket-additions/server/Dockerfile', 'pocket-additions/server/server.py',
          'pocket-additions/server/.dockerignore') }}
    - name: Build Ubuntu amd64 image and test authenticated health endpoint
      run: |
        set -euo pipefail
        if [[ -s pocket-image/pocket-companion-image.tar.gz ]]; then
          docker load -i pocket-image/pocket-companion-image.tar.gz
        else
          docker build -t pocket-companion:local pocket-additions/server
        fi
        export POCKET_TOKEN="$(openssl rand -hex 32)"
        cid=$(docker run -d -e POCKET_TOKEN -p 127.0.0.1:8088:8088 pocket-companion:local)
        trap 'docker rm -f "$cid" >/dev/null' EXIT
        python3 - <<'PY'
        import os,time,urllib.request,urllib.error,json
        for attempt in range(30):
            try:
                r=urllib.request.Request('http://127.0.0.1:8088/health',headers={'Authorization':'Bearer '+os.environ['POCKET_TOKEN']})
                with urllib.request.urlopen(r,timeout=2) as response:
                    assert json.load(response)['status']=='ok'
                break
            except (OSError,ValueError):time.sleep(1)
        else:raise SystemExit('Companion failed health check')
        try:
