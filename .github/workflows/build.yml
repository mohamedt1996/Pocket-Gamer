    - name: Build the in-process Wine server base
      run: |
        # cache-source: serverbase
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        BD="$GITHUB_WORKSPACE/build/wineserver"
        OBJ="$BD/obj"
        mkdir -p "$OBJ/base"
        FLAGS=(-arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -O2
          -I"$GITHUB_WORKSPACE/wine/include" -I"$GITHUB_WORKSPACE/wine/include/wine"
          -I"$GITHUB_WORKSPACE/wine/build-macos/include"
          -I"$BD" -I"$GITHUB_WORKSPACE/wine/server"
