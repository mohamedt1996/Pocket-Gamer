    - name: Build Wine server adapter
      run: |
        # cache-source: serveradapter
        bash build/wineserver/build.sh 2>&1 | tee wineserver.log
      if: steps.cache_serveradapter.outputs.cache-hit != 'true'
    - name: Save completed serveradapter
      uses: actions/cache/save@v5
      if: steps.cache_serveradapter.outputs.cache-hit != 'true'
      with:
        path: app/Madeira/libwineserver.a
        key: ${{ steps.cachekeys.outputs.serveradapter }}
    - name: Restore window
      uses: actions/cache/restore@v5
      id: cache_window
      with:
        path: app/Madeira/libwin32u_unix.a
        key: ${{ steps.cachekeys.outputs.window }}
    - name: Build Wine window adapter
      run: |
        # cache-source: window
        bash build/win32u-unix/build.sh 2>&1 | tee win32u.log
      if: steps.cache_window.outputs.cache-hit != 'true'
    - name: Save completed window
      uses: actions/cache/save@v5
      if: steps.cache_window.outputs.cache-hit != 'true'
      with:
        path: app/Madeira/libwin32u_unix.a
