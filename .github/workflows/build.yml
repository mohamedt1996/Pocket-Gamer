# Pocket Arcade: self-contained experimental iOS hub and Ubuntu companion.
# Save as .github/workflows/build.yml. Push to main or run manually.
# Uses standard hosted runners. First Windows runtime build can take hours.
# No QEMU/SPICE rebuilds. Native runtime and GB/GBC core caches are independent.
# Embedded source is checksum-verified and published as PocketArcade-sources.
# iOS compilation and on-device play are not yet verified by the author.
# Legacy Flutter jobs remain opt-in and require your own mobile project sources.
# Successful dependencies are saved individually; cache keys hash their source and build recipes.
name: Pocket Arcade - Unified iOS and Android
permissions:
  contents: write
  actions: read
concurrency:
  group: pocket-arcade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: 3.35.7
