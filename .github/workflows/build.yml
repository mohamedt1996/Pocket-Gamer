      if: steps.cache_gnutls.outputs.cache-hit != 'true'
    - name: Save completed gnutls
      uses: actions/cache/save@v5
      if: steps.cache_gnutls.outputs.cache-hit != 'true'
      with:
        path: toolchains/gnutls-ios
        key: ${{ steps.cachekeys.outputs.gnutls }}
    - name: Restore ffmpeg
      uses: actions/cache/restore@v5
      id: cache_ffmpeg
      with:
        path: |-
          toolchains/ffmpeg-ios
          app/Madeira/libavformat.a
          app/Madeira/libavcodec.a
          app/Madeira/libswresample.a
          app/Madeira/libavutil.a
        key: ${{ steps.cachekeys.outputs.ffmpeg }}
    - name: Build FFmpeg
      run: |
        # cache-source: ffmpeg
        bash build/ffmpeg/build.sh 2>&1 | tee ffmpeg.log
      if: steps.cache_ffmpeg.outputs.cache-hit != 'true'
    - name: Save completed ffmpeg
