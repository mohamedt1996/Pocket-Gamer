        name: PocketArcade-sources
        path: pocket-additions
    - uses: actions/cache/restore@v5
      id: companioncache
      with:
        path: pocket-image/pocket-companion-image.tar.gz
        key: pocket-companion-amd64-v1-${{ hashFiles('pocket-additions/server/Dockerfile', 'pocket-additions/server/server.py',
          'pocket-additions/server/.dockerignore') }}
    - name: Build Ubuntu amd64 image and test authenticated health endpoint
      run: |
        set -euo pipefail
        if [[ -s pocket-image/pocket-companion-image.tar.gz ]]; then
          docker load -i pocket-image/pocket-companion-image.tar.gz
        else
          docker build -t pocket-companion:local pocket-additions/server
        fi
        export POCKET_TOKEN="$(openssl rand -hex 32)"
        cid=$(docker run -d -e POCKET_TOKEN -p 127.0.0.1:8088:8088 pocket-companion:local)
        trap 'docker rm -f "$cid" >/dev/null' EXIT
        python3 - <<'PY'
        import os,time,urllib.request,urllib.error,json
        for attempt in range(30):
            try:
                r=urllib.request.Request('http://127.0.0.1:8088/health',headers={'Authorization':'Bearer '+os.environ['POCKET_TOKEN']})
                with urllib.request.urlopen(r,timeout=2) as response:
                    assert json.load(response)['status']=='ok'
                break
            except (OSError,ValueError):time.sleep(1)
        else:raise SystemExit('Companion failed health check')
        try:
            urllib.request.urlopen('http://127.0.0.1:8088/health')
        except urllib.error.HTTPError as e:
            assert e.code==401
        else:raise SystemExit('Unauthenticated request unexpectedly accepted')
        PY
        mkdir -p output/companion
        cp -R pocket-additions/server/. output/companion/
        mkdir -p pocket-image
        if [[ ! -s pocket-image/pocket-companion-image.tar.gz ]]; then
          docker save pocket-companion:local | gzip -1 > pocket-image/pocket-companion-image.tar.gz
        fi
        cp pocket-image/pocket-companion-image.tar.gz output/companion/
        cp pocket-additions/README.md output/
        (cd output/companion && sha256sum pocket-companion-image.tar.gz > SHA256SUMS.txt)
    - uses: actions/cache/save@v5
      if: steps.companioncache.outputs.cache-hit != 'true'
      with:
        path: pocket-image/pocket-companion-image.tar.gz
        key: pocket-companion-amd64-v1-${{ hashFiles('pocket-additions/server/Dockerfile', 'pocket-additions/server/server.py',
          'pocket-additions/server/.dockerignore') }}
    - uses: actions/upload-artifact@v7
      with:
        name: PocketArcade-Ubuntu-companion-amd64
        path: output/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Require actual application sources
      shell: bash
      run: |
        set -euo pipefail
        for path in mobile/pubspec.yaml mobile/pubspec.lock mobile/lib/main.dart mobile/android mobile/ios mobile/test server/Dockerfile server/.dockerignore ci/test-server.sh; do
          if [[ ! -e "$path" ]]; then
            echo "::error::Missing $path. This workflow builds existing source; it does not generate the application or integrate emulators."
            exit 1
          fi
        done
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true
    - name: Resolve locked dependencies and validate mobile source
      working-directory: mobile
      run: |
        set -euo pipefail
        flutter pub get --enforce-lockfile
        flutter analyze --fatal-infos
        flutter test
    if: github.event_name == 'workflow_dispatch' && inputs.build_full_hub
