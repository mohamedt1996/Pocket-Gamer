        path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
        key: pocket-mingw-20260421-verified-v1
    - name: Fetch checksum-pinned Windows cross compiler
      run: |
        mkdir -p toolchains
        curl -fL --retry 3 https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz -o "$RUNNER_TEMP/mingw.tar.xz"
        echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  $RUNNER_TEMP/mingw.tar.xz" | shasum -a 256 -c -
        tar -xJf "$RUNNER_TEMP/mingw.tar.xz" -C toolchains
      if: steps.mingw.outputs.cache-hit != 'true'
    - uses: actions/cache/save@v5
      if: steps.mingw.outputs.cache-hit != 'true'
      with:
        path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
        key: pocket-mingw-20260421-verified-v1
    - name: Add cross compiler to PATH
      run: |
        echo "$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin" >> "$GITHUB_PATH"
    - uses: actions/checkout@v7
      with:
        path: pocket-workflow
        persist-credentials: false
    - name: Compute per-dependency source and build-recipe keys
      id: cachekeys
      env:
        SDK_ID: ${{ steps.sdk.outputs.id }}
      run: |
        python3 - <<'PYKEYS'
        import hashlib,json,os,re,subprocess
        from pathlib import Path
        meta={'llvm': {'inputs': [], 'deps': []}, 'winehost': {'inputs': ['wine'], 'deps': []}, 'wineheaders': {'inputs': ['wine'], 'deps': ['winehost']}, 'freetype': {'inputs': ['build/freetype-ios'], 'deps': []}, 'gnutls': {'inputs': ['build/gnutls-ios'], 'deps': []}, 'ffmpeg': {'inputs': ['build/ffmpeg'], 'deps': []}, 'ntdll': {'inputs': ['wine', 'build/ntdll-unix', 'build/crypto', 'build/madsync', 'build/ffmpeg'], 'deps': ['wineheaders', 'freetype', 'gnutls', 'ffmpeg']}, 'serverbase': {'inputs': ['wine', 'build/wineserver', 'build/madsync', 'build/ntdll-unix'], 'deps': ['wineheaders']}, 'serveradapter': {'inputs': ['wine', 'build/wineserver', 'build/madsync'], 'deps': ['serverbase']}, 'window': {'inputs': ['wine', 'build/win32u-unix', 'build/ntdll-unix'], 'deps': ['wineheaders', 'freetype']}, 'fex': {'inputs': ['FEX'], 'deps': []}, 'dxmt': {'inputs': ['dxmt', 'build/dxmt-ios', 'wine'], 'deps': ['wineheaders', 'llvm']}, 'pairing': {'inputs': ['build/rppairing-ios'], 'deps': []}, 'dock': {'inputs': ['madeira-dock', 'build/madeira-dock'], 'deps': []}}
        # Read the workflow from the user's repository, not from the upstream runtime checkout.
        workflow_path='/'.join(os.environ['GITHUB_WORKFLOW_REF'].split('@',1)[0].split('/')[2:])
        text=(Path('pocket-workflow')/workflow_path).read_text()
        recipes={k:[] for k in meta}
        common_recipe=[]
        for match in re.finditer(r'^      run: [|][^\n]*\n((?:        [^\n]*\n|\n)*)',text,re.M):
            body='\n'.join(line[8:] if line.startswith('        ') else line for line in match.group(1).splitlines())+'\n'
            if body.startswith('# cache-toolchain\n'):common_recipe.append(body)
            marker=re.search(r'^# cache-source: ([a-z]+)$',body,re.M)
            if marker and marker.group(1) in recipes:recipes[marker.group(1)].append(body)
        keys={}
        for key,item in meta.items():
            if not recipes[key]:raise SystemExit('No build recipe found for '+key)
            source=subprocess.check_output(['git','ls-tree','-r','HEAD','--',*item['inputs']]) if item['inputs'] else b''
            recipe=''.join(recipes[key])
            dependencies=[keys[x] for x in item['deps']]
            digest=hashlib.sha256(source+recipe.encode()+''.join(common_recipe).encode()+json.dumps(dependencies).encode()).hexdigest()[:24]
            keys[key]='pocket-component-v1-'+key+'-'+os.environ['SDK_ID']+'-'+digest
        # No broad fallback: old outputs may be incompatible. This one is the known successful LLVM build.
        legacy=''
        if hashlib.sha256((''.join(recipes['llvm'])+''.join(common_recipe)).encode()).hexdigest()=='e8cf6286a5c4ad579f0ed21fe342f6b63d00399e115f92efc113efe9620527a7':
            legacy='pocket-llvm15-ios-v2-'+os.environ['SDK_ID']
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            for k,v in keys.items():f.write(k+'='+v+'\n')
            f.write('llvmlegacy='+legacy+'\n')
        print('Dependency cache keys prepared; unrelated application changes do not invalidate them.')
        PYKEYS
    - uses: actions/cache/restore@v5
      id: llvmcache
      with:
        path: |-
          toolchains/llvm-project
          toolchains/llvm-ios-build
          toolchains/llvm-host-build
        key: ${{ steps.cachekeys.outputs.llvm }}
        restore-keys: ${{ steps.cachekeys.outputs.llvmlegacy }}
    - name: Build LLVM 15.0.7 for iOS (two-stage, per build/dxmt-ios/README.md)
      if: steps.llvmcache.outputs.cache-matched-key == ''
      shell: bash
      run: |
        # cache-source: llvm
        git clone --depth 1 --branch llvmorg-15.0.7 \
          https://github.com/llvm/llvm-project.git toolchains/llvm-project
        # README: Apple ld rejects --gc-sections; make the Darwin branch cover iOS
        sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' \
          toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake
        grep -n 'Darwin|iOS' toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake

        # LLVM 15 also misclassifies iOS in its ELF undefined-symbol linker flags.
        python3 - <<'PYFIX'
        from pathlib import Path
        p = Path('toolchains/llvm-project/llvm/cmake/modules/HandleLLVMOptions.cmake')
        text = p.read_text()
        old = 'Darwin|FreeBSD|OpenBSD|DragonFly|AIX|SunOS|OS390'
        assert text.count(old) == 1, 'LLVM linker-flags patch anchor changed'
        p.write_text(text.replace(old, 'Darwin|iOS|FreeBSD|OpenBSD|DragonFly|AIX|SunOS|OS390'))
        PYFIX

        # stage 1: host llvm-tblgen only (use Xcode clang, not brew's newer one)
        cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DLLVM_TARGETS_TO_BUILD="" -DLLVM_INCLUDE_TESTS=Off \
          -DLLVM_INCLUDE_EXAMPLES=Off -DLLVM_INCLUDE_BENCHMARKS=Off \
          2>&1 | tee "$GITHUB_WORKSPACE/llvm-host-cfg.log"
        cmake --build toolchains/llvm-host-build --target llvm-tblgen \
          -j"$(sysctl -n hw.ncpu)" 2>&1 | tee "$GITHUB_WORKSPACE/llvm-host-build.log"

        # stage 2: iOS target libs, reusing host tblgen
        cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/toolchains/llvm-host-build/bin/llvm-tblgen" \
          -DCMAKE_MACOSX_BUNDLE=OFF \
          -DLLVM_BUILD_UTILS=Off -DLLVM_BUILD_TOOLS=Off \
          -DLLVM_INCLUDE_TOOLS=Off -DLLVM_BUILD_LLVM_DYLIB=Off \
          -DLLVM_LINK_LLVM_DYLIB=Off -DBUILD_SHARED_LIBS=Off \
          -DLLVM_TARGETS_TO_BUILD="" \
          -DLLVM_INCLUDE_TESTS=Off -DLLVM_INCLUDE_EXAMPLES=Off \
          -DLLVM_INCLUDE_BENCHMARKS=Off -DLLVM_INCLUDE_UTILS=Off \
          -DLLVM_ENABLE_TERMINFO=Off -DLLVM_ENABLE_LIBXML2=Off \
          -DLLVM_ENABLE_ZSTD=Off -DLLVM_ENABLE_ZLIB=Off \
          2>&1 | tee "$GITHUB_WORKSPACE/llvm-ios-cfg.log"
        cmake --build toolchains/llvm-ios-build -j"$(sysctl -n hw.ncpu)" \
          2>&1 | tee "$GITHUB_WORKSPACE/llvm-ios-build.log"
    - uses: actions/cache/save@v5
      if: steps.llvmcache.outputs.cache-hit != 'true'
      with:
        path: |-
          toolchains/llvm-project
          toolchains/llvm-ios-build
          toolchains/llvm-host-build
        key: ${{ steps.cachekeys.outputs.llvm }}
    - name: Adapt Wine dependency scanning for external iOS shim headers
      run: |
        # cache-source: winehost
        python3 - <<'PY'
        from pathlib import Path
        p=Path('wine/tools/makedep.c');s=p.read_text()
        old='fatal_error( "%s must be included before other headers\\n", file->name );'
        new='fprintf( stderr, "warning: %s precedes config.h in the iOS port\\n", file->name );'
        assert s.count(old)==1
        s=s.replace(old,new)
        old='    if (make->external) return NULL; /* ignore missing files in external libs */\n'
        assert s.count(old)==1
        s=s.replace(old,old+'    if (!strncmp( source->name, "ios_", 4 )) return NULL; /* external iOS shims */\n')
        p.write_text(s)
        PY
        git -C wine diff > output/wine-ci.patch
    - name: Restore winehost
      uses: actions/cache/restore@v5
      id: cache_winehost
      with:
        path: wine/build-native
        key: ${{ steps.cachekeys.outputs.winehost }}
    - name: Build Wine host tools and generated headers
      run: |
        # cache-source: winehost
        mkdir -p wine/build-native
        cd wine/build-native
        ../configure --enable-win64 --without-x --disable-tests 2>&1 | tee "$GITHUB_WORKSPACE/wine-host-configure.log"
        make -j2 __tooldeps__ 2>&1 | tee "$GITHUB_WORKSPACE/wine-host-tools.log"
        # Wine's own target includes make_xftmpl and all other native generators.
        for tool in tools/makedep tools/make_xftmpl tools/widl/widl tools/wrc/wrc tools/wmc/wmc tools/winebuild/winebuild tools/winegcc/winegcc tools/sfnt2fon/sfnt2fon; do
          test -x "$tool" || { echo "::error::Missing Wine host tool: $tool"; exit 1; }
        done
      if: steps.cache_winehost.outputs.cache-hit != 'true'
    - name: Save completed winehost
      uses: actions/cache/save@v5
      if: steps.cache_winehost.outputs.cache-hit != 'true'
      with:
        path: wine/build-native
        key: ${{ steps.cachekeys.outputs.winehost }}
    - name: Restore wineheaders
      uses: actions/cache/restore@v5
      id: cache_wineheaders
      with:
        path: wine/build-macos
        key: ${{ steps.cachekeys.outputs.wineheaders }}
    - name: Configure wine (build-macos, cross)
      run: |
        # cache-source: wineheaders
        cd wine
        mkdir -p build-macos
        cd build-macos
        ../configure --enable-win64 --disable-tests \
          CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0" \
          CROSSCC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0" \
          --host=aarch64-apple-darwin --build="$(uname -m)-apple-darwin" \
          --with-wine-tools="$GITHUB_WORKSPACE/wine/build-native" \
          --without-freetype --without-fontconfig \
          --without-x --without-opengl --without-vulkan \
          --without-gnutls --without-pcsclite --without-usb \
          --without-v4l2 --without-gphoto --without-inotify \
          --without-sane --without-pulse --without-alsa --without-oss \
          --without-capi --without-cups --without-krb5 --without-ldap \
          --without-netapi --without-sdl --without-udev --without-unwind \
          2>&1 | tee "$GITHUB_WORKSPACE/wine-configure.log"
      if: steps.cache_wineheaders.outputs.cache-hit != 'true'
    - name: Generate cross-tree headers and patch config.h for iOS SDK
      shell: bash
      run: |
        # cache-source: wineheaders
        make -C wine/build-macos -j2 include/all 2>&1 | tee "$GITHUB_WORKSPACE/make-include.log"
        CFG=wine/build-macos/include/config.h
        {
          echo ""
          echo "/* iOS SDK fixups appended by CI */"
          echo "#undef HAVE_GETATTRLIST"
          echo "#ifndef D_TAPE"
          echo "#define D_TAPE 1"
          echo "#endif"
          echo "#ifndef D_DISK"
          echo "#define D_DISK 2"
          echo "#endif"
          echo "#ifndef D_TTY"
          echo "#define D_TTY 3"
          echo "#endif"
          echo ""
          echo "/* Wine configure runs --without-gnutls here (the host has no"
          echo " * gnutls for the iOS sysroot), so config.h defines neither of"
          echo " * these. But dlls/bcrypt/gnutls.c is wrapped head-to-toe in"
          echo " * #ifdef HAVE_GNUTLS_CIPHER_INIT and dlls/secur32/schannel_gnutls.c"
          echo " * in #ifdef SONAME_LIBGNUTLS -- undefined, both compile to an"
          echo " * EMPTY object, __wine_unix_call_funcs is never emitted, and the"
          echo " * app link dies on _bcrypt_unix_call_funcs / _secur32_unix_call_funcs."
          echo " * We link toolchains/gnutls-ios statically and ios_gnutls_shim.h"
          echo " * rewrites dlopen/dlsym onto a static symtab, so the soname string"
          echo " * is only ever pattern-matched, never actually dlopen()ed. */"
          echo "#ifndef SONAME_LIBGNUTLS"
          echo "#define SONAME_LIBGNUTLS \"libgnutls.so.30\""
          echo "#endif"
          echo "#ifndef HAVE_GNUTLS_CIPHER_INIT"
          echo "#define HAVE_GNUTLS_CIPHER_INIT 1"
          echo "#endif"
        } >> "$CFG"
        # Require the actual IDL-generated headers consumed by the iOS adapters.
        python3 - <<'PYHEADERS'
        from pathlib import Path
